<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Voice Assistant — Siri-style Overlay · Mission 2028</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Noto+Serif+Devanagari:wght@500;600&display=swap" rel="stylesheet" />
<style>
/* ============================================================
   VOICE ASSISTANT — SIRI-STYLE EDGE-GLOW OVERLAY
   Standalone design reference for "Mission 2028".
   ----------------------------------------------------------------
   • NOT a page. It is a full-viewport OVERLAY that is invisible
     until the assistant wakes (on wake-word / voice).
   • Look & motion modelled on Apple's Siri: a soft, flowing,
     multi-colour light that hugs the screen EDGES, breathes, and
     reacts to your voice amplitude. Tinted with the site palette
     (gold / saffron / green + cool accents).
   • The faux page behind is ONLY here to show the overlay in
     context — it is not part of the deliverable.
   • Voice logic is faked (state switcher + simulated amplitude)
     so each state previews standalone. See README at the bottom.
   ============================================================ */
:root{
  --bg:#05070f; --bg-2:#080d1c; --bg-3:#0b1224;
  --ink:#eaf0ff; --ink-soft:#b9c6e6; --muted:#6f7d9e;
  --line:rgba(120,168,255,0.13); --line-2:rgba(120,168,255,0.22);
  --panel:rgba(124,170,255,0.04);
  /* site accent (gold) + national + cool tones for the Siri flow */
  --accent:#f0b54a; --accent-2:#ffe39a; --accent-ink:#f3dba6;
  --saffron:#ff9933; --india-green:#1fbf6b; --cool:#4aa0ff; --teal:#43e6d0; --violet:#b06cff;
  --good:#45e0a8;
  --font-display:'Sora',system-ui,sans-serif;
  --font-body:'Manrope',system-ui,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,monospace;
  /* live amplitude 0..1, driven by JS (fake here, real analyser in prod) */
  --amp:0;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--font-body); -webkit-font-smoothing:antialiased; overflow:hidden;
}

/* ---------- faux page behind (context only) ---------- */
.page{ position:fixed; inset:0; z-index:0; padding:48px; overflow:hidden; }
.page::before{
  content:""; position:absolute; inset:0; z-index:-1;
  background:
    radial-gradient(900px 600px at 80% 8%, color-mix(in oklab,var(--accent) 9%,transparent), transparent 60%),
    radial-gradient(800px 600px at 10% 100%, color-mix(in oklab,var(--cool) 8%,transparent), transparent 55%),
    linear-gradient(180deg,var(--bg),var(--bg-2));
}
.page-nav{ display:flex; justify-content:space-between; align-items:center; font-family:var(--font-mono); font-size:12px; letter-spacing:.18em; text-transform:uppercase; color:var(--muted); }
.page-nav b{ color:var(--ink); font-family:var(--font-display); letter-spacing:-.01em; text-transform:none; font-size:16px; }
.page-hero{ max-width:680px; margin:14vh auto 0; text-align:center; }
.page-hero .eyebrow{ font-family:var(--font-mono); font-size:12px; letter-spacing:.3em; text-transform:uppercase; color:var(--accent-ink); }
.page-hero h1{ font-family:var(--font-display); font-weight:600; letter-spacing:-.03em; font-size:clamp(34px,6vw,68px); margin:18px 0 0; line-height:1; }
.page-hero p{ color:var(--ink-soft); margin:18px 0 0; }
.page-dim{ position:fixed; inset:0; z-index:1; background:rgba(3,5,12,0); backdrop-filter:blur(0px); transition:background .6s ease, backdrop-filter .6s ease; pointer-events:none; }

/* ============================================================
   THE OVERLAY  (this is the deliverable)
   data-state on <body>: idle | listening | thinking | speaking
   ============================================================ */
#va-overlay{ position:fixed; inset:0; z-index:30; pointer-events:none; }

/* --- AURORA curtains: soft flowing ribbons of light (Siri x northern lights) --- */
.va-aurora{ position:fixed; inset:-10%; z-index:30; pointer-events:none; overflow:hidden;
  opacity:0; transition:opacity .7s ease; filter:blur(56px) saturate(1.35);
  -webkit-mask-image:radial-gradient(130% 120% at 50% 50%, #000 30%, transparent 92%);
          mask-image:radial-gradient(130% 120% at 50% 50%, #000 30%, transparent 92%); }
body:not([data-state="idle"]) .va-aurora{ opacity:calc(.62 + var(--amp) * .38); }
.va-aurora span{ position:absolute; mix-blend-mode:screen; border-radius:48% 52% 60% 40% / 55% 48% 52% 45%;
  filter:blur(8px); will-change:transform; }
.va-aurora .r1{ width:62vw; height:120vh; left:-6vw; top:-30vh; background:radial-gradient(circle, var(--saffron), transparent 62%);
  animation:auroraDrift1 13s ease-in-out infinite; }
.va-aurora .r2{ width:54vw; height:120vh; left:24vw; top:-26vh; background:radial-gradient(circle, var(--violet), transparent 62%);
  animation:auroraDrift2 17s ease-in-out infinite; }
.va-aurora .r3{ width:58vw; height:120vh; right:-4vw; top:-32vh; background:radial-gradient(circle, var(--cool), transparent 62%);
  animation:auroraDrift1 15s ease-in-out infinite reverse; }
.va-aurora .r4{ width:50vw; height:120vh; left:36vw; top:-20vh; background:radial-gradient(circle, var(--teal), transparent 62%);
  animation:auroraDrift2 19s ease-in-out infinite reverse; }
.va-aurora .r5{ width:46vw; height:120vh; left:8vw; top:-24vh; background:radial-gradient(circle, var(--accent), transparent 62%);
  animation:auroraDrift1 21s ease-in-out infinite; }
@keyframes auroraDrift1{ 0%,100%{ transform:translateX(0) translateY(0) scaleY(1) skewX(-6deg);} 50%{ transform:translateX(8vw) translateY(4vh) scaleY(1.12) skewX(8deg);} }
@keyframes auroraDrift2{ 0%,100%{ transform:translateX(0) translateY(2vh) scaleY(1.08) skewX(5deg);} 50%{ transform:translateX(-7vw) translateY(-3vh) scaleY(.94) skewX(-7deg);} }
body[data-state="thinking"] .va-aurora{ opacity:.6; }

/* --- the flowing edge glow (kept, softened — frames the aurora) --- */
.va-glow{
  position:fixed; inset:-12%;
  background:conic-gradient(from var(--rot,0deg),
    var(--accent), var(--saffron), var(--violet), var(--cool),
    var(--teal), var(--india-green), var(--accent-2), var(--accent));
  filter:blur(calc(60px + var(--amp) * 34px)) saturate(1.25);
  -webkit-mask-image:radial-gradient(120% 116% at 50% 50%, transparent 52%, #000 74%);
          mask-image:radial-gradient(120% 116% at 50% 50%, transparent 52%, #000 74%);
  opacity:0; transform:scale(1);
  transition:opacity .6s ease, transform .6s ease;
}
body:not([data-state="idle"]) .va-glow{ opacity:.55; }
/* a crisp inner light line, just inside the glow */
.va-rim{
  position:fixed; inset:10px; border-radius:30px; pointer-events:none;
  box-shadow:inset 0 0 0 1px color-mix(in oklab, var(--accent) 30%, transparent),
             inset 0 0 60px -20px color-mix(in oklab, var(--accent-2) 60%, transparent);
  opacity:0; transition:opacity .6s ease;
}

/* show the glow whenever the assistant is awake */
body:not([data-state="idle"]) .va-rim{ opacity:1; }
body:not([data-state="idle"]) .page-dim{ background:rgba(3,5,12,.45); backdrop-filter:blur(3px); }

/* amplitude breathes the whole glow */
body[data-state="listening"] .va-glow,
body[data-state="speaking"] .va-glow{ transform:scale(calc(1 + var(--amp) * .03)); }
body[data-state="thinking"] .va-glow{ opacity:.78; }

/* --- bottom caption + transcript (Siri text) --- */
.va-dock{
  position:fixed; left:0; right:0; bottom:0; z-index:32; padding:40px 24px 46px;
  display:flex; flex-direction:column; align-items:center; gap:14px; text-align:center;
  pointer-events:none;
  -webkit-mask-image:linear-gradient(0deg,#000 60%, transparent);
          mask-image:linear-gradient(0deg,#000 60%, transparent);
  opacity:0; transform:translateY(16px); transition:opacity .5s ease, transform .5s ease;
}
body:not([data-state="idle"]) .va-dock{ opacity:1; transform:none; }

.va-state-label{ font-family:var(--font-mono); font-size:11px; letter-spacing:.3em; text-transform:uppercase; color:var(--accent-ink);
  display:inline-flex; align-items:center; gap:10px; }
.va-state-label .dot{ width:7px; height:7px; border-radius:50%; background:var(--accent); box-shadow:0 0 10px var(--accent); }
[data-state="listening"] .va-state-label .dot{ background:var(--good); box-shadow:0 0 10px var(--good); }
[data-state="speaking"] .va-state-label .dot{ background:var(--accent-2); box-shadow:0 0 10px var(--accent-2); }

.va-transcript{
  font-family:var(--font-display); font-weight:500; letter-spacing:-.01em;
  font-size:clamp(22px,3.4vw,34px); line-height:1.25; color:var(--ink); max-width:760px; text-wrap:pretty;
  text-shadow:0 2px 30px rgba(0,0,0,.6);
}
.va-transcript .caret{ display:inline-block; width:3px; height:1em; background:var(--accent); margin-left:3px; vertical-align:-2px; border-radius:2px; animation:blink 1s steps(1) infinite; }
@keyframes blink{ 50%{opacity:0;} }

/* --- centered CIRCULAR waveform (Siri-style radial waves) --- */
.va-ring{ position:fixed; left:50%; top:46%; transform:translate(-50%,-50%); z-index:31; width:340px; height:340px;
  pointer-events:none; opacity:0; transition:opacity .5s ease; }
body[data-state="listening"] .va-ring, body[data-state="thinking"] .va-ring, body[data-state="speaking"] .va-ring{ opacity:1; }
.va-ring canvas{ position:absolute; inset:0; width:100%; height:100%; }

/* idle wake-hint (only in the demo so you know how to trigger it) */
.va-hint{
  position:fixed; left:50%; bottom:36px; transform:translateX(-50%); z-index:32;
  font-family:var(--font-mono); font-size:12px; letter-spacing:.18em; text-transform:uppercase; color:var(--muted);
  display:inline-flex; align-items:center; gap:10px; transition:opacity .4s;
}
.va-hint .mini{ width:18px; height:18px; }
.va-hint .mini svg{ width:100%; height:100%; }
body:not([data-state="idle"]) .va-hint{ opacity:0; }

/* ---------- preview switcher (NOT shipped) ---------- */
.switcher{ position:fixed; top:18px; left:50%; transform:translateX(-50%); z-index:60; display:flex; gap:8px; align-items:center;
  background:color-mix(in oklab,var(--bg) 70%,transparent); border:1px solid var(--line-2); border-radius:12px; padding:8px; backdrop-filter:blur(10px); }
.switcher .lab{ font-family:var(--font-mono); font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:var(--muted); padding:0 6px; }
.seg{ font-family:var(--font-mono); font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-soft);
  background:transparent; border:1px solid transparent; padding:8px 12px; border-radius:8px; cursor:pointer; transition:all .2s; }
.seg:hover{ color:#fff; }
.seg.active{ background:var(--accent); color:var(--bg); font-weight:700; }
.disclaimer{ position:fixed; top:64px; left:50%; transform:translateX(-50%); z-index:60; font-family:var(--font-mono); font-size:10.5px; letter-spacing:.04em; color:var(--muted); background:color-mix(in oklab,var(--bg) 60%,transparent); padding:5px 12px; border-radius:8px; }

@media (prefers-reduced-motion: reduce){
  .va-glow{ animation:none !important; }
  .va-aurora span{ animation:none !important; }
  .va-transcript .caret{ animation:none; }
}
</style>
</head>
<body data-state="idle">

<!-- ===== faux page behind (context only — delete when integrating) ===== -->
<div class="page">
  <div class="page-nav"><b>Mission 2028</b><span>UPSC Command Center</span></div>
  <div class="page-hero">
    <span class="eyebrow">Your page keeps working underneath</span>
    <h1>The comeback<br/>starts now.</h1>
    <p>Say “Hey Saathi” and the assistant wakes — the screen edges come alive.</p>
  </div>
</div>
<div class="page-dim"></div>

<!-- ===== preview controls (NOT part of the deliverable) ===== -->
<div class="switcher">
  <span class="lab">Preview</span>
  <button class="seg active" data-go="idle">Asleep</button>
  <button class="seg" data-go="listening">Listening</button>
  <button class="seg" data-go="thinking">Thinking</button>
  <button class="seg" data-go="speaking">Speaking</button>
</div>
<div class="disclaimer">Edge-glow reacts to <b>VA.setAmplitude()</b> · wakes on voice in production</div>

<!-- ===== THE OVERLAY (deliverable) ===== -->
<div id="va-overlay" aria-live="polite">
  <div class="va-aurora"><span class="r1"></span><span class="r2"></span><span class="r3"></span><span class="r4"></span><span class="r5"></span></div>
  <div class="va-glow" id="va-glow"></div>
  <div class="va-rim"></div>
</div>

<div class="va-hint">
  <span class="mini"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></span>
  Say “Hey Saathi” to wake
</div>

<!-- centered circular waveform -->
<div class="va-ring" id="va-ring"><canvas id="va-ring-cv" width="680" height="680"></canvas></div>

<div class="va-dock" id="va-dock">
  <span class="va-state-label"><span class="dot"></span><span id="va-state-text">Listening…</span></span>
  <div class="va-transcript" id="va-transcript"></div>
</div>

<script>
/* ============================================================
   DESIGN-REFERENCE DRIVER
   Runs the flowing edge-glow, the live bars, and FAKES audio so
   each state animates. Replace the "FAKE" bits with real logic.
   ============================================================ */
(function(){
  const $=(s,r=document)=>r.querySelector(s);
  const $$=(s,r=document)=>[...r.querySelectorAll(s)];
  const body=document.body;
  const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* circular waveform canvas (radial bars + ripple rings) */
  const ringCv=$('#va-ring-cv'), rctx=ringCv.getContext('2d');
  let RDPR=Math.min(2,devicePixelRatio||1);
  function ringSize(){ RDPR=Math.min(2,devicePixelRatio||1); ringCv.width=340*RDPR; ringCv.height=340*RDPR; }
  ringSize(); addEventListener('resize',ringSize);
  const RBARS=88;
  const rphase=new Array(RBARS).fill(0).map((_,i)=>i*0.4);
  let ripples=[]; let lastPeak=0;

  /* animation loop: flow the conic gradient + smooth amplitude + circular waves */
  let amp=0, ampTarget=0, rot=0, t=0;
  function frame(){
    requestAnimationFrame(frame);
    t+=0.016;
    amp+=(ampTarget-amp)*0.12;
    document.documentElement.style.setProperty('--amp',amp.toFixed(3));
    const st=body.dataset.state;
    // flow speed depends on state
    const speed=(st==='thinking')?1.6:(st==='speaking')?0.9:(st==='listening')?0.5:0.18;
    rot=(rot+speed)%360;
    $('#va-glow').style.setProperty('--rot',rot+'deg');
    drawRing(st);
  }
  function drawRing(st){
    const W=ringCv.width,H=ringCv.height,cx=W/2,cy=H/2;
    rctx.clearRect(0,0,W,H);
    if(st==='idle') return;
    const accent=getComputedStyle(document.documentElement).getPropertyValue('--accent').trim()||'#f0b54a';
    const accent2=getComputedStyle(document.documentElement).getPropertyValue('--accent-2').trim()||'#ffe39a';
    const baseR=92*RDPR;
    const maxLen=(st==='thinking'?16:64)*RDPR;
    // spawn an expanding ripple on amplitude peaks (listening/speaking)
    if((st==='listening'||st==='speaking') && amp>0.55 && (t-lastPeak)>0.32){ ripples.push({r:baseR,a:0.5}); lastPeak=t; }
    ripples.forEach(rp=>{ rp.r+=2.4*RDPR; rp.a-=0.012; });
    ripples=ripples.filter(rp=>rp.a>0);
    ripples.forEach(rp=>{
      rctx.beginPath(); rctx.arc(cx,cy,rp.r,0,Math.PI*2);
      rctx.strokeStyle=accent2; rctx.globalAlpha=Math.max(0,rp.a); rctx.lineWidth=1.4*RDPR; rctx.stroke();
    });
    rctx.globalAlpha=1;
    // radial bars forming the circular waveform
    for(let i=0;i<RBARS;i++){
      const ang=(i/RBARS)*Math.PI*2;
      const wob=Math.sin(t*4.4+rphase[i])*0.5+0.5;
      const react=(st==='thinking')? (0.2+0.25*wob)
                 : amp*(0.42+0.58*wob);
      const len=maxLen*react + 3*RDPR;
      const x1=cx+Math.cos(ang)*baseR, y1=cy+Math.sin(ang)*baseR;
      const x2=cx+Math.cos(ang)*(baseR+len), y2=cy+Math.sin(ang)*(baseR+len);
      const g=rctx.createLinearGradient(x1,y1,x2,y2);
      g.addColorStop(0,accent); g.addColorStop(1,accent2);
      rctx.strokeStyle=g; rctx.lineWidth=3*RDPR; rctx.lineCap='round';
      rctx.globalAlpha=0.92;
      rctx.beginPath(); rctx.moveTo(x1,y1); rctx.lineTo(x2,y2); rctx.stroke();
    }
    // soft inner ring outline
    rctx.globalAlpha=0.5; rctx.strokeStyle=accent; rctx.lineWidth=1*RDPR;
    rctx.beginPath(); rctx.arc(cx,cy,baseR-4*RDPR,0,Math.PI*2); rctx.stroke();
    rctx.globalAlpha=1;
  }
  if(!reduced) frame();

  /* ============================================================
     PUBLIC API — real voice logic calls these
     ============================================================ */
  const stateText={ idle:'', listening:'Listening…', thinking:'Thinking…', speaking:'Speaking' };
  const VA={
    /* 'idle' = asleep/overlay hidden. Wake-word → setState('listening'). */
    setState(s){
      body.dataset.state=s;
      $('#va-state-text').textContent=stateText[s]||'';
      if(s==='idle'){ ampTarget=0; this.setTranscript('',true); }
      document.dispatchEvent(new CustomEvent('va:state',{detail:s}));
    },
    setAmplitude(v){ ampTarget=Math.max(0,Math.min(1,v)); },   /* feed from AnalyserNode each frame */
    setTranscript(text,isFinal){
      const el=$('#va-transcript');
      el.innerHTML = text ? (text + (isFinal?'':'<span class="caret"></span>')) : '';
    }
  };
  window.VA=VA;

  /* ============================================================
     FAKE DEMO LOGIC — delete when wiring real voice
     ============================================================ */
  setInterval(()=>{
    const s=body.dataset.state;
    if(s==='listening') VA.setAmplitude(0.3+Math.random()*0.7);
    else if(s==='speaking') VA.setAmplitude(0.4+Math.abs(Math.sin(performance.now()/170))*0.6);
    else if(s==='thinking') VA.setAmplitude(0.12);
  },90);

  const demo={
    listening:'Plan my revision for Polity this week',
    speaking:"Sure — Fundamental Rights today, DPSP tomorrow, then 40 previous-year questions."
  };
  function demoText(s){
    clearInterval(window.__vaType);
    if(s==='listening'){ VA.setTranscript(demo.listening,false); }
    else if(s==='thinking'){ VA.setTranscript('',true); }
    else if(s==='speaking'){
      const full=demo.speaking; let i=0;
      window.__vaType=setInterval(()=>{
        i+=Math.ceil(full.length/55);
        VA.setTranscript(full.slice(0,i), i>=full.length);
        if(i>=full.length) clearInterval(window.__vaType);
      },42);
    } else VA.setTranscript('',true);
  }

  $$('.seg').forEach(b=>b.addEventListener('click',()=>{
    $$('.seg').forEach(x=>x.classList.remove('active')); b.classList.add('active');
    const s=b.dataset.go; VA.setState(s); demoText(s);
  }));

  VA.setState('idle');
})();
</script>
</body>
</html>
